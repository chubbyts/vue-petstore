sonar.organization=chubbyts
sonar.projectKey=chubbyts_vue-petstore
sonar.projectName=vue-petstore

sonar.sources=src
sonar.exclusions=tests/**
sonar.tests=tests
sonar.language=typescript
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# S8957 "Vue component props should declare a type": false positive - props are typed
# via TypeScript on the setup function, which Sonar cannot see in JSX components.
# S6479 "JSX list components should not use array indexes as key": list items
# (vaccinations, invalid parameters) have no stable identity, index is the correct key.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S8957
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.tsx
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S6479
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.tsx
